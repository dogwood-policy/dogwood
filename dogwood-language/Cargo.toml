[[test]]
name = "net_provider"
path = "tests/net_provider.rs"

# Partition-safety differential: with a universal symmetric pin, global-run
# verdicts per key must equal sliced-run verdicts (the "pinned => safe to
# partition" guarantee of the relativization rewrite).
[[test]]
name = "pin_partition_differential"
path = "tests/pin_partition_differential.rs"

# Regression: a provider that errors at runtime must fail closed (Deny).
[[test]]
name = "fail_closed"
path = "tests/fail_closed.rs"

# The MCP-manifest and macro-library schema-loading conveniences.
[[test]]
name = "schema_loading"
path = "tests/schema_loading.rs"

