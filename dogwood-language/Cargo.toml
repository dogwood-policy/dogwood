[package]
name = "amzn-dogwood-language"
version = "1.0.0"
edition = "2024"
publish.workspace = true
description = "The Dogwood surface language: parser, validator, interpreter, and the per-request authorizer. The single published front door; implementation modules are crate-private."
exclude = ["/build", "/Config", "/build-tools/"]

# In-source crate identifier `dogwood_language` (the published crate is
# `amzn-dogwood-language`). The whole frontend lives in this one crate as
# crate-private modules, so consumers can only reach the curated public
# surface in `lib.rs`.
[lib]
name = "dogwood_language"

[dependencies]
pest = "2"
pest_derive = "2"
thiserror = "1"
miette = { version = "7" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cedar-policy-core = "4.11"
# High-level Cedar API used for authorization (the public Authorizer /
# Request / Response / Decision). Re-exported through the front door so
# consumers don't depend on Cedar directly.
cedar-policy = "4.11"
smol_str = "0.3"
# `NonEmpty<SmolStr>` is the attribute-path type Cedar's `ExprBuilder`
# takes for the extended-`has` operator; we name it directly when lowering
# a `has a.b.c` to loc-bearing `ast`.
nonempty = "0.12"
# MCP -> Cedar schema generation: a Dogwood schema is an MCP tool
# manifest, turned into a Cedar schema via this generator.
cedar-policy-mcp-schema-generator = "0.6"
mcp-tools-sdk = "0.4"
# Information-provider evaluation. A provider's implementation is a
# sandboxed Rhai script: a bare engine has no file/network/process
# access — capabilities are exposed only by host functions we register
# (e.g. the `regex`-backed string helpers). `decimal` lets a script
# return Cedar decimal-typed outputs; `sync` makes the engine Send+Sync
# so it can live in a server's request path.
rhai = { version = "1", features = ["decimal", "sync"] }
regex = "1"
rust_decimal = "1"
# Embeds the temporal regression corpus into the crate (feature `corpus`) so
# that an alternative implementation of the temporal engine can be checked
# against the same cases the in-memory engine is validated against.
include_dir = { version = "0.7", optional = true }

[features]
# Expose the embedded temporal regression corpus via `crate::corpus`.
# Off by default: only callers that want to check an alternative engine
# against the corpus need the ~13MB of embedded case data.
corpus = ["dep:include_dir"]

# Register a networked `http_get(url)` host function for provider scripts
# (fetch-a-value-from-the-web, in the spirit of OPA/Rego's `http.send`).
# OFF BY DEFAULT and deliberately so: it makes the provider engine
# non-deterministic (a script's output then depends on the network), which
# the default build forbids. Only turn it on when a deployment genuinely
# wants providers to reach the network. No extra dependency — the client
# is a minimal synchronous HTTP/1.0 GET over `std::net`.
net = []

[dev-dependencies]
miette = { version = "7", features = ["fancy-no-backtrace"] }

