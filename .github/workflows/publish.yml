name: Publish to crates.io

# Manual GitHub Action to publish the dogwood-language crate to crates.io from
# the 1.0 release line.
#
# The crate version comes from Cargo.toml, so a 1.0.x patch needs no edit here,
# only the version bump. crates.io rejects a re-publish of an existing version,
# so bump the version before running.
#
# Auth is Trusted Publishing over OIDC, so no API token is stored as a secret.
# The crate's config on crates.io must name this repository and this file,
# publish.yml, exactly. See https://crates.io/docs/trusted-publishing

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only (build, package and verify; no upload)"
        type: boolean
        default: true

permissions:
  id-token: write # mint the OIDC token crates.io exchanges for a registry token
  contents: read

concurrency:
  group: publish-crates-io
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    # Optional approval gate. Needs a `release` environment in repo settings AND
    # the same name in the crate's crates.io config — the environment is part of
    # the OIDC claim, so a mismatch fails at token-minting time.
    # environment: release

    steps:
      # persist-credentials: false — the checkout token isn't used after checkout.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustc --version

      # Runs on every invocation, dry run included. Cargo.lock is not committed,
      # so dependency resolution floats and a semver-compatible upstream release
      # can land between the commit CI validated and this publish.
      - name: Test
        run: cargo test --workspace

      # Verify the crate packages cleanly from a clean tarball — catches a file
      # that `exclude` drops but the build needs. `-p` names the internal crate;
      # the public tree renames it, so the public workflow runs against the
      # public name. Cannot catch an already-published version (that check is
      # server-side at upload), so the real publish below is the only version
      # check — bump the version and re-run.
      - name: Verify build and packaging
        run: cargo publish -p dogwood-language --dry-run

      # Pinned to a commit SHA rather than a mutable tag or branch; the action
      # handles the registry credential and revokes it in a post step.
      - name: Authenticate to crates.io (Trusted Publishing)
        if: ${{ !inputs.dry_run }}
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish dogwood-language
        if: ${{ !inputs.dry_run }}
        run: cargo publish -p dogwood-language
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Summary
        if: ${{ always() }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run only — nothing was uploaded to crates.io."
          else
            echo "Publish attempted for dogwood-language; check the step outcome above."
          fi >> "$GITHUB_STEP_SUMMARY"
