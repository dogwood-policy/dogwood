[workspace]
resolver = "2"
# The semantic Dogwood frontend is a single crate: `dogwood-language` holds
# both the public surface and the (crate-private) implementation. The separate
# `dogwood-syntax` crate contains only source syntax shared with formatting.
members = [
    # Shared policy grammar and lossless concrete syntax. Semantic parsing and
    # source formatting both depend on this layer so their syntax cannot drift.
    "dogwood-syntax",
    "dogwood-language",
    # Source-preserving pretty-printer for `.dw` policy files. Kept separate
    # from the language crate because formatting works on the authored token
    # stream (including macros/comments), not the macro-expanded semantic AST.
    "dogwood-formatter",
    # Host-neutral operations over the frontend's public surface (schema/policy
    # in, owned serializable reports and diagnostics out), plus the live
    # event-at-a-time authorizer. Shared by the CLI and the language bindings
    # (WebAssembly, Python), so the report/error JSON shape — a contract with
    # all of them — is defined once.
    "dogwood-ops",
    # `dogwood-cli` is the `dogwood` binary — a thin shell over `dogwood-ops`
    # that parses arguments and renders the reports.
    "dogwood-cli",
    # The documentation crate: the guide prose plus complete, CLI-checked
    # example bundles (policy + schema [+ trace/providers]). Its test harness
    # runs each bundle through the `dogwood` binary, so a doc example that stops
    # compiling is a build failure.
    "dogwood-docs",
    # Editor-agnostic Language Server Protocol implementation. The server owns
    # diagnostics, semantic-token projection, project resolution, and stdio
    # protocol handling; editor extensions live outside this repository.
    "dogwood-lsp",
    # A test of the language crate's Lean frontend as a dependency: a crate that
    # compiles Lean modules of its own against the crate's Lean library and links
    # them with its Lean runtime. Not published; empty unless built with its
    # `lean` feature (`cargo test -p dogwood-lean-dependent --features lean`).
    "dogwood-language/lean-dependent",
]

[workspace.package]
version = "1.2.0"
edition = "2024"
# Registry for crates that inherit publish.workspace = true.
publish = ["crates-io"]
