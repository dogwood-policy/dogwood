[package]
name = "dogwood-lsp"
version = "0.1.0"
edition.workspace = true
publish = false
description = "The editor-agnostic Dogwood Language Server Protocol implementation."
exclude = ["/build", "/Config", "/build-tools/"]

[lib]
name = "dogwood_lsp"

[[bin]]
name = "dogwood-lsp"
path = "src/main.rs"

[features]
default = []
test-control = []

[dependencies]
dogwood-language = { path = "../dogwood-language" }
crossbeam-channel = "0.5.15"
lsp-server = "0.10.0"
lsp-types = "0.97.0"
miette = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[dev-dependencies]
escargot = "0.5"
sha2 = "0.10.9"
