# git-cliff configuration for Dogwood changelog generation.
#
# CHANGELOG.md is a tracked file that flows to the public GitHub repo via the
# publish-to-github snapshot. Authors regenerate it before raising a CR.
#
# Usage:
#   git cliff --config cliff.toml "$(cat .changelog-baseline)..HEAD" -o CHANGELOG.md
#
# .changelog-baseline is the initial public release commit and stays FIXED.
# Each regeneration captures all changes since that point (cumulative).
# The file grows over time as new conventional commits land.

[changelog]
header = """# Changelog

All notable changes to the Dogwood policy language are documented here.
This changelog is generated from [conventional commits](https://www.conventionalcommits.org/).

"""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^style", group = "Changed" },
  { message = "^doc", group = "Documentation" },
  { message = "^test", group = "Testing" },
  { message = "^chore", group = "Miscellaneous" },
  { message = "^ci", group = "Miscellaneous" },
  { message = "^security", group = "Security" },
  { message = "^Merge", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
# We use .changelog-baseline for the range, not tags. But keep the pattern
# so git-cliff can group by version if tags are present.
sort_commits = "newest"
